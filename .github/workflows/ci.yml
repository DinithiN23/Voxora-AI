name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./voxora-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Type Check (mypy)
        run: mypy app/
        continue-on-error: true # Let it pass for now if typing isn't perfect
        
      - name: Start Server in Background
        run: |
          # Dummy auth token if needed, start FastAPI
          nohup uvicorn app.main:app --port 8000 &
          sleep 5
          
      - name: Smoke Test - Health Endpoint
        run: curl -f http://localhost:8000/health
        
      - name: Smoke Test - Dashboard Endpoint
        run: curl -f "http://localhost:8000/api/v1/dashboards/executive?time_range=30d"

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./voxora-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './voxora-frontend/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: ESLint
        run: npm run lint
        
      - name: Type Check
        run: npx tsc --noEmit
